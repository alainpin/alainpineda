<script>
// The navbar's ES/EN switcher is defined once per profile in _quarto-en.yml
// and _quarto-es.yml, always pointing at the other language's homepage
// (href: "/es/" or "/"). Since every EN page has an ES counterpart at the
// same slug (see CLAUDE.md section 4), rewrite that link at load time to the
// equivalent page instead: strip or add the leading "/es" path segment.
(function () {
  var path = window.location.pathname;
  var target;
  if (path === "/es" || path.indexOf("/es/") === 0) {
    target = path.replace(/^\/es/, "") || "/";
  } else {
    target = path === "/" ? "/es/" : "/es" + path;
  }
  var link = document.querySelector(
    'a[aria-label="Ver en español"], a[aria-label="View in English"]'
  );
  if (link) link.setAttribute("href", target);
})();
</script>
