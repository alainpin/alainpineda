# Netlify aqui solo sirve archivos ya compilados. NO compila el sitio.
#
# Configuracion en el panel de Netlify:
#   Branch to deploy .... gh-pages
#   Build command ....... (vacio)
#   Publish directory ... /
#
# GitHub Actions corre build.sh en cada push a main, junta ingles y espanol
# en _site/ y empuja el resultado a la rama gh-pages. Netlify solo la sirve.
# El DNS y el dominio se quedan donde estan; no hay que tocar nada ahi.

[build]
  command = ""
  publish = "/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/index.es.html"
  to = "/es/"
  status = 301
